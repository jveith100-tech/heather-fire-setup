<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Heather Fire - QR Code</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:40px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.4)}

.sub{font-size:14px;color:#8b949e;margin-bottom:28px}
.qr-box{background:#fff;border-radius:12px;padding:20px;display:inline-block;margin-bottom:24px}
.qr-box img{display:block;width:200px;height:200px}
.url{font-size:13px;color:#58a6ff;word-break:break-all;margin-bottom:24px}
.btn{display:inline-block;background:#238636;color:#fff;font-size:14px;font-weight:600;padding:10px 24px;border-radius:8px;text-decoration:none;margin:6px}
.btn2{background:#21262d;border:1px solid #30363d}
footer{margin-top:24px;font-size:12px;color:#484f58}

</head>
<body>
<div class="card">
<div class="badge">QR Code</div>
<h1>Heather Fire Setup</h1>
<p class="sub">Scan to open the tablet setup page on any device</p>
<div class="qr-box">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://jveith100-tech.github.io/heather-fire-setup/" alt="QR Code">
</div>
<p class="url">https://jveith100-tech.github.io/heather-fire-setup/</p>
<a href="index.html" class="btn">Back to Setup</a>
<a href="https://jveith100-tech.github.io/heather-fire-setup/" class="btn btn2" target="_blank">Open Live Site</a>
<footer>Heather Fire Incident - Deployed via GitHub Pages - 2026</footer>
</div>
</body>
</html>
